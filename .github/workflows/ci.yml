name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native .revealui/content is the reference. Vendor trees are projections.
  copy-lockstep:
    name: Copy lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify copy-mode lockstep
        run: bash scripts/verify-copy-lockstep.sh --target "$GITHUB_WORKSPACE"

  parse-shell:
    name: bash -n (all .sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Syntax-check every shell script
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! out=$(bash -n "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=1
            else
              echo "ok  $f"
            fi
          done < <(git ls-files '*.sh')
          exit "$fail"

  git-hooks-validate:
    # M-11 fleet-wide pre-push hook lives under git-hooks/ without a .sh
    # extension (git looks for exact names like `pre-push`), so the
    # parse-shell job above does NOT cover it. Lint + syntax-check
    # everything under git-hooks/ here.
    name: bash -n + shellcheck (git-hooks/*)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: bash -n every git hook
        run: |
          set -euo pipefail
          fail=0
          if [ ! -d git-hooks ]; then
            echo "git-hooks/ directory missing. M-11 bootstrap will skip wiring"
            exit 1
          fi
          while IFS= read -r -d '' f; do
            # Skip markdown / non-script files inside the dir
            case "$f" in *.md) continue ;; esac
            if ! out=$(bash -n "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=1
            else
              echo "ok  $f"
            fi
          done < <(find git-hooks -type f -print0)
          exit "$fail"
      - name: ShellCheck git-hooks/*
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: error
          scandir: ./git-hooks

  parse-powershell:
    name: PowerShell parse (all .ps1/.psm1/.psd1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Parse every PowerShell file
        shell: pwsh
        run: |
          $fail = 0
          $files = git ls-files '*.ps1' '*.psm1' '*.psd1'
          foreach ($f in $files) {
            $errs = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs.Count -gt 0) {
              Write-Output "::error file=$f::$($errs[0].Message)"
              foreach ($e in $errs) { Write-Output "  $($e.Message) (line $($e.Extent.StartLineNumber))" }
              $fail = 1
            } else {
              Write-Output "ok  $f"
            }
          }
          exit $fail

  shellcheck:
    name: ShellCheck (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          ignore_paths: tests
          ignore_names: ""

  no-hardcoded-user:
    name: GAP-116 anti-regression. No hardcoded "joshu"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Grep for hardcoded "joshu" in scripted files
        run: |
          set -euo pipefail
          # Acceptance test from gaps/GAP-116.yml. Must be 0.
          # Limited to scripted file types so this workflow file (which has
          # to mention the literal patterns to scan for them) doesn't
          # match itself.
          includes=(--include='*.sh' --include='*.ps1' --include='*.psm1' --include='*.psd1')
          hits=$(grep -rn 'joshu\b' "${includes[@]}" . || true)
          if [ -n "$hits" ]; then
            echo "::error::Hardcoded user-account name found in scripted files. See GAP-116."
            echo "$hits"
            exit 1
          fi
          mnt_hits=$(grep -rn '/mnt/c/Users/joshu' "${includes[@]}" . || true)
          if [ -n "$mnt_hits" ]; then
            echo "::error::Hardcoded /mnt/c/Users path found in scripted files. See GAP-116."
            echo "$mnt_hits"
            exit 1
          fi
          echo "ok. No hardcoded user paths in scripted files"

  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # gitleaks CLI binary (MIT, free). The gitleaks-action wrapper requires a
      # paid license for organization accounts and fails on Dependabot PRs.
      GITLEAKS_VERSION: "8.30.0"
      # SHA256 of gitleaks_<ver>_linux_x64.tar.gz (from gitleaks_<ver>_checksums.txt);
      # verified before install to close the curl|tar supply-chain gap. Bump with VERSION.
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}" -o "/tmp/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        run: |
          gitleaks detect --no-banner --redact \
            --report-path /tmp/gitleaks-report.json --report-format json

  private-leak-scan:
    name: Private Leak Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Scan for private paths and credentials
        run: bash scripts/check-no-private-leaks.sh
      - name: Fail on tracked binary archives
        run: |
          # Binary archives evade leak scanning (check-no-private-leaks.sh
          # excludes *.tar.gz and gitleaks does not unpack them). Keep them out
          # of version control entirely; pre-rewrite snapshots live on E:.
          matches=$(git ls-files -- '*.tar.gz' '*.tgz' '*.tar' '*.zip')
          if [ -n "$matches" ]; then
            echo "::error title=Tracked archive::Binary archives must not be tracked (they bypass leak scanning):"
            echo "$matches"
            exit 1
          fi

  test-mcp-smoke:
    name: MCP smoke protocol and deadlines
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run synthetic MCP transport and process regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -p test_probe.py -v
          python3 -m unittest discover -s tests -p test_transport_wrapper.py -v
          bash -n shell/bin/revealui-mcp-smoke.sh

  test-secrets:
    name: tests/test-secrets.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run secrets tests
        run: bash tests/test-secrets.sh

  test-rfg-env:
    # P1: rfg env used to printf REVEALUI_MCP_TOKEN (stdout secret-exfil).
    # Behavioral + static guard: stubbed vault, assert token never appears.
    name: tests/test-rfg-env.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Prove rfg env never prints the MCP token
        run: bash tests/test-rfg-env.sh

  test-audit-storm:
    # Leftover home-wide du/find audits wedge WSL I/O and hang rfg.
    # Preflight must run before sync/MCP/grok and must not hard-fail launch.
    name: tests/test-audit-storm.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run audit-storm preflight tests
        run: bash tests/test-audit-storm.sh

  test-rfx:
    # Codex launcher parity. Dry-run and env only. Does not exec codex.
    name: tests/test-rfx.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run rfx launcher tests
        run: bash tests/test-rfx.sh

  test-rfc:
    name: tests/test-rfc.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run rfc launch-parity tests
        run: bash tests/test-rfc.sh

  test-local-ai-shell:
    name: tests/test-local-ai-shell.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run local-ai shell auto-load tests
        run: bash tests/test-local-ai-shell.sh

  test-revkit-mode:
    name: tests/test-revkit-mode.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run shell-mode resolver + vibe subset tests
        run: bash tests/test-revkit-mode.sh

  test-revealui-retired:
    # GAP-351. Retire shim must not start tmux; must name rfg/rfc.
    name: tests/test-revealui-retired.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run retired revealui launcher tests
        run: bash tests/test-revealui-retired.sh

  test-grok-attach:
    name: tests/test-grok-attach.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run Grok manager-attach tests
        run: bash tests/test-grok-attach.sh

  test-fleet-root:
    name: tests/test-fleet-root.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run fleet-root resolve tests
        run: bash tests/test-fleet-root.sh

  test-fleet-workflow-health:
    # GAP-420. Regression guard for the consecutive-failure predicate that
    # backs scripts/fleet-workflow-health.sh (see fleet-workflow-health.yml).
    # Network-free: exercises the --self-test canned fixture only.
    name: tests/test-fleet-workflow-health.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run fleet workflow health self-test
        run: bash tests/test-fleet-workflow-health.sh

  test-pre-push-hook:
    # M-11 hook smoke test. Builds a throwaway git repo with real commits,
    # invokes the hook with various ref combinations, asserts exit codes +
    # stderr content. Does NOT exercise the deployed hook (no remote in CI);
    # verifies its enforcement logic in isolation.
    name: tests/test-pre-push-hook.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run pre-push hook tests
        run: bash tests/test-pre-push-hook.sh

  test-check-no-client-names:
    # Layer B watchlist gate: file scan stays the default, commit-message
    # mode and the commit-msg helper use placeholder patterns only.
    name: tests/test-check-no-client-names.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run client-name watchlist gate tests
        run: bash tests/test-check-no-client-names.sh

  bootstrap-m11-wiring:
    # Sanity-check that bootstrap.sh (the canonical cross-platform entry point)
    # still references the M-11 hook dir + sets core.hooksPath; that the
    # bootstrap-wsl.sh deprecation shim still execs bootstrap.sh; and that
    # bootstrap.ps1 (Windows host) is intact. Catches accidental removal of the
    # wiring during unrelated refactors. Read-only. Does not execute any
    # bootstrap script.
    name: bootstrap M-11 wiring intact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check bootstrap.sh (canonical) + shim chain + bootstrap.ps1
        run: |
          set -euo pipefail
          fail=0
          if ! grep -qF 'git-hooks' bootstrap.sh; then
            echo "::error file=bootstrap.sh::M-11 wiring lost: no reference to git-hooks"
            fail=1
          fi
          if ! grep -qF 'core.hooksPath' bootstrap.sh; then
            echo "::error file=bootstrap.sh::M-11 wiring lost: no core.hooksPath setup"
            fail=1
          fi
          if ! grep -qF 'pre-push' bootstrap.sh; then
            echo "::error file=bootstrap.sh::M-11 wiring lost: no pre-push hook deploy"
            fail=1
          fi
          # The deprecation shim is optional. Only assert the exec chain if it
          # still exists, so deleting the shim doesn't hard-fail this job.
          if [ -f bootstrap-wsl.sh ]; then
            if ! grep -qF 'bootstrap.sh' bootstrap-wsl.sh; then
              echo "::error file=bootstrap-wsl.sh::deprecation shim chain broken: no exec of bootstrap.sh"
              fail=1
            fi
          fi
          if ! grep -qF 'git-hooks' bootstrap.ps1; then
            echo "::error file=bootstrap.ps1::M-11 wiring lost: no reference to git-hooks/"
            fail=1
          fi
          if ! grep -qF 'core.hooksPath' bootstrap.ps1; then
            echo "::error file=bootstrap.ps1::M-11 wiring lost: no core.hooksPath setup"
            fail=1
          fi
          exit "$fail"

  pester:
    name: PowerShell Pester tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Pester 5
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.5.0
          (Get-Module Pester).Version | Write-Host
      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/powershell'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  platform-detect:
    name: platform.sh fixture detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run platform detection fixtures
        run: bash tests/test-platform-detect.sh

  bootstrap-dry-run:
    # Phase C. Real-OS smoke of the cross-platform bootstrap. The
    # platform-detect job above only exercises lib/platform.sh against
    # fixtures; this actually RUNS bootstrap.sh on real Linux (every PR) + macOS (main + dispatch) runners
    # (detect-then-dispatch from #68), proving the dispatch executes per-OS,
    # not just that detection returns the right string. --dry-run makes no
    # changes (every mutating step is gated on DRY_RUN); we assert exit 0.
    # The wsl code path is exercised via the REVKIT_OS override on the ubuntu
    # runner (GitHub has no hosted WSL runner).
    name: bootstrap --dry-run smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners bill at a 10x minute multiplier on private repos,
        # which exhausts the monthly free Actions allotment fast. Keep
        # per-PR runs Linux-only (1x); validate macOS only post-merge
        # (push to main) and on manual workflow_dispatch.
        os: ${{ (github.event_name == 'pull_request') && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: bootstrap.sh --dry-run (native OS detection)
        run: bash bootstrap.sh --dry-run
      - name: bootstrap.sh --dry-run (wsl code path via REVKIT_OS override)
        if: runner.os == 'Linux'
        env:
          REVKIT_OS: wsl
        run: bash bootstrap.sh --dry-run

  bootstrap-real-run:
    # Phase C exit proof: a REAL (non-dry-run) bootstrap on a disposable Linux
    # runner. The dry-run matrix above proves the dispatch executes; this proves
    # bootstrap.sh actually PRODUCES a working managed environment (rc hook,
    # helpers, git/ssh includes, M-4 scanner, M-11 hooksPath). The ephemeral
    # runner is the safe sandbox. These steps mutate $HOME + /usr/local/bin +
    # global git config. WSL-only steps (sudoers, boot-opt, sandbox init) are
    # skipped (REVKIT_OS auto-detects as linux here). revcon/link.sh (step 9)
    # is absent on the runner and warns-and-skips by design.
    name: bootstrap real-run smoke (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run bootstrap.sh (real, non-dry-run)
        run: bash bootstrap.sh
      - name: Assert it produced a working managed environment
        run: |
          set -uo pipefail   # NOT -e: accumulate all checks, fail at the end
          fail=0
          assert() {
            if [ "$2" -eq 0 ]; then echo "ok   $1"; else echo "::error::FAILED $1"; fail=1; fi
          }
          grep -qF '# --- RevealUI environment mode ---' "$HOME/.bashrc"; assert "rc hook installed in ~/.bashrc" $?
          test -x /usr/local/bin/rfc.sh; assert "helper rfc.sh installed + executable" $?
          test -x /usr/local/bin/rfx.sh; assert "helper rfx.sh installed + executable" $?
          test -L /usr/local/bin/rfx; assert "rfx symlink installed next to rfg.sh" $?
          test "$(readlink /usr/local/bin/rfx)" = "rfx.sh"; assert "rfx symlink target is rfx.sh" $?
          test -x /usr/local/bin/rfx; assert "rfx symlink is executable" $?
          test -f /usr/local/lib/revkit/kill-audit-storms.sh; assert "audit sweeper lib installed" $?
          test -f /usr/local/lib/revkit/rfg-storm-preflight.sh; assert "rfg storm preflight lib installed" $?
          test -x /usr/local/bin/kill-audit-storms; assert "kill-audit-storms wrapper installed + executable" $?
          git config --global --get-all include.path | grep -qF 'shell/config/gitconfig'; assert "git include.path -> shell/config/gitconfig" $?
          test -f "$HOME/.config/revkit/identity.gitconfig"; assert "per-user identity.gitconfig seeded" $?
          git config --global --get core.hooksPath | grep -qF 'git-hooks'; assert "M-11 core.hooksPath -> repo git-hooks" $?
          test -f "$HOME/.revealui/hooks/m4-sudoers-fs-scanner.js"; assert "M-4 scanner deployed to ~/.revealui/hooks" $?
          test ! -e "$HOME/.claude"; assert "default run does not create ~/.claude" $?
          grep -q 'hooks = false' "$HOME/.grok/config.toml"; assert "grok compat.claude hooks off by default" $?
          grep -q 'mcps = false' "$HOME/.grok/config.toml"; assert "grok compat.claude mcps off by default" $?
          grep -q 'sessions = false' "$HOME/.grok/config.toml"; assert "grok compat.claude sessions off by default" $?
          exit "$fail"
      - name: Re-run is idempotent (self-healing hook, no duplicate)
        run: |
          set -euo pipefail
          bash bootstrap.sh
          count="$(grep -cF '# --- RevealUI environment mode ---' "$HOME/.bashrc")"
          test "$count" -eq 1 || { echo "::error::rc hook duplicated on re-run (count=$count)"; exit 1; }
          echo "ok   idempotent re-run (single rc hook block)"
          test ! -e "$HOME/.claude"
          test -f "$HOME/.revealui/hooks/m4-sudoers-fs-scanner.js"

  test-bootstrap-native:
    name: tests/test-bootstrap-native.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run native-home bootstrap tests
        run: bash tests/test-bootstrap-native.sh
