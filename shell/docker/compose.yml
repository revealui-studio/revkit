# Sandbox infrastructure services
# Usage: sandbox up | sandbox down | sandbox status

services:
  postgres:
    image: postgres:17-alpine
    container_name: sandbox-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sandbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in shell/docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:-sandbox}
    volumes:
      - ${SANDBOX_DATA:-/mnt/sandbox/databases}/postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sandbox}"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: sandbox-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - ${SANDBOX_DATA:-/mnt/sandbox/databases}/redis:/data
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: sandbox-ollama
    profiles: ["ai"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ${SANDBOX_DATA:-/mnt/sandbox/models}:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G
    environment:
      OLLAMA_HOST: 127.0.0.1
